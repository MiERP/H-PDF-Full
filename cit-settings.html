<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cài đặt - H-PDF</title>
    <meta name="robots" content="noindex, nofollow" />

    <link href="/src/css/styles.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  </head>

  <body class="antialiased bg-gray-900">
    {{> navbar }}

    <main class="container mx-auto max-w-3xl px-4 py-8 text-gray-200">
      <h1
        class="text-2xl font-bold text-white mb-6"
        data-desktop-i18n="settingsTitle"
      >
        Settings
      </h1>

      <section class="settings-card">
        <h2 class="settings-card-title" data-desktop-i18n="themeTitle">
          Appearance
        </h2>
        <div
          id="desktop-theme-options"
          class="inline-flex rounded-lg border border-gray-700 bg-gray-900 p-1"
          role="radiogroup"
        >
          <button
            type="button"
            role="radio"
            data-theme-option="light"
            class="desktop-theme-option"
          >
            <i class="ph ph-sun"></i>
            <span data-desktop-i18n="themeLight">Light</span>
          </button>
          <button
            type="button"
            role="radio"
            data-theme-option="dark"
            class="desktop-theme-option"
          >
            <i class="ph ph-moon"></i>
            <span data-desktop-i18n="themeDark">Dark</span>
          </button>
          <button
            type="button"
            role="radio"
            data-theme-option="system"
            class="desktop-theme-option"
          >
            <i class="ph ph-desktop"></i>
            <span data-desktop-i18n="themeSystem">System</span>
          </button>
        </div>

        <div class="mt-5 space-y-3">
          <div class="settings-row">
            <label
              for="desktop-language-select"
              class="flex-1 text-sm font-medium text-gray-200"
              data-desktop-i18n="language"
            >
              Language
            </label>
            <select
              id="desktop-language-select"
              data-no-translate
              class="ml-4 w-56 rounded-md border border-gray-600 bg-gray-800 px-3 py-2 text-sm text-white outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            ></select>
          </div>
          <div class="settings-row">
            <div class="flex-1">
              <label
                for="auto-update-toggle"
                class="text-sm font-medium text-gray-200 cursor-pointer"
                data-desktop-i18n="autoUpdate"
              >
                Check for updates automatically
              </label>
              <p
                class="text-xs text-gray-400 mt-1"
                data-desktop-i18n="autoUpdateDescription"
              >
                Once a day, asks GitHub whether a new version is out and shows
                it on the home page. Nothing is downloaded or installed.
              </p>
            </div>
            <label
              class="relative inline-flex items-center cursor-pointer ml-4"
            >
              <input
                type="checkbox"
                id="auto-update-toggle"
                class="sr-only peer"
              />
              <div
                class="w-11 h-6 bg-gray-700 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-800 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"
              ></div>
            </label>
          </div>
        </div>
      </section>
    </main>

    {{> warning-modal }} {{> footer }}
    <script type="module" src="/src/js/utils/lucide-init.ts"></script>
    <script type="module" src="/src/js/utils/simple-mode-footer.ts"></script>
    <script type="module" src="/src/js/desktop/settings-page.ts"></script>
    <script type="module" src="/src/js/main.ts"></script>
  </body>
</html>
